<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — DORXWEA TATTOO</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="logo">DORXWEA<span>✦</span>TATTOO</a>
    
    <nav class="nav-links" id="navLinks">
      <a href="index.html#about" data-i18n="navAbout">O mnie</a>
      <a href="index.html#services" data-i18n="navServices">Usługi</a>
      <a href="works.html" class="active highlight-link" data-i18n="navPortfolio">Portfolio ✦</a>
      <a href="index.html#booking" class="btn-nav" data-i18n="navBook">Zapisz się</a>
    </nav>

    <div class="lang-switch">
      <button class="lang-btn active" data-lang="pl">PL</button>
      <button class="lang-btn" data-lang="ru">RU</button>
      <button class="lang-btn" data-lang="ua">UA</button>
      <button class="lang-btn" data-lang="en">EN</button>
    </div>

    <button class="burger" id="burgerBtn" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="container portfolio-page">
    <div class="portfolio-header">
      <h1 class="gradient-text" data-i18n="portfolioTitle">Portfolio prac</h1>
      <p data-i18n="portfolioDesc">Zobacz moje zrealizowane tatuaże oraz wolne autorskie szkice.</p>
    </div>

    <!-- Фильтры: Только 2 категории + Все -->
    <div class="filter-tabs">
      <button class="tab-btn active" data-category="all" data-i18n="tabAll">Wszystkie prace</button>
      <button class="tab-btn" data-category="custom" data-i18n="tabCustom">📸 Moje prace</button>
      <button class="tab-btn" data-category="flash" data-i18n="tabFlash">🎨 Szkice</button>
    </div>

    <div id="gallery" class="gallery-grid"></div>
    
    <div id="galleryEmpty" class="empty-state" style="display: none;">
      <p data-i18n="emptyState">Brak prac w tej kategorii.</p>
    </div>
  </main>

  <div id="imageModal" class="modal">
    <span class="modal-close" id="modalClose">&times;</span>
    <div class="modal-content-wrapper">
      <img id="modalImg" src="" alt="Work">
      <div class="modal-info">
        <span id="modalCategory" class="badge">Kategoria</span>
        <p id="modalDesc" class="modal-description"></p>
      </div>
    </div>
  </div>

  <footer>
    <p>© DORXWEA TATTOO. All rights reserved.</p>
    <p><a href="#" id="privacyBtn" class="privacy-link" data-i18n="privacyLink">Polityka Prywatności (RODO)</a></p>
  </footer>

  <div id="privacyModal" class="modal">
    <div class="modal-content-wrapper privacy-card">
      <span class="modal-close" id="privacyClose">&times;</span>
      <h3 class="gradient-text" data-i18n="privacyTitle">Polityka prywatności</h3>
      <p id="privacyText" data-i18n="privacyText"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
