<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>O mnie — DORXWEA TATTOO</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <header class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">DORXWEA TATTOO</a>
      
      <nav class="nav-links">
        <a href="about.html" class="nav-link active" data-i18n="navAbout">O mnie</a>
        <a href="works.html" class="nav-link" data-i18n="navPortfolio">Portfolio</a>
        <a href="reviews.html" class="nav-link" data-i18n="navReviews">Opinie</a>
      </nav>

      <div class="lang-switcher">
        <button class="lang-btn active" onclick="setLang('pl')">PL</button>
        <button class="lang-btn" onclick="setLang('ru')">RU</button>
        <button class="lang-btn" onclick="setLang('ua')">UA</button>
        <button class="lang-btn" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <main class="container page-content">
    <div class="page-header">
      <h1 data-i18n="navAbout">O mnie</h1>
    </div>

    <!-- Пустой блок под твой текст -->
    <section class="about-custom-text" style="max-width: 800px; margin: 0 auto 50px; text-align: center;">
      <p style="color: var(--text-muted); font-size: 18px;">
        <!-- Место для твоего текста -->
      </p>
    </section>

    <!-- Блок сертификатов -->
    <section class="certs-section" style="margin-top: 40px;">
      <h2 style="text-align: center; margin-bottom: 20px;">Certyfikaty</h2>
      <div class="certs-grid" style="display: flex; justify-content: center; gap: 20px; flex-wrap: wrap;">
        <!-- Карточка сертификата (шаблон) -->
        <div style="background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 16px; text-align: center; width: 250px;">
          <i data-lucide="award" style="width: 48px; height: 48px; color: var(--accent-gold); margin-bottom: 10px;"></i>
          <p style="font-weight: 700;">Certificate Name</p>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
